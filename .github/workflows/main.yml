name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly scan, Mondays 03:00 UTC
 
# Least-privilege default; jobs elevate only what they need
permissions:
  contents: read
 
# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
env:
  DOTNET_VERSION: 10.0.x
  # Path to your solution/project, relative to the repo root.
  # Solution file committed at the repo root (see setup notes).
  SOLUTION: CLDV6212IceTask.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
 
jobs:
  # ---------------------------------------------------------------------
  # PLACEHOLDER: replace with your existing build-and-test job.
  # The security-scan job below depends on this job name.
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
 
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore -c Release
 
      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --no-build -c Release
 
  # ---------------------------------------------------------------------
  # Security scanning
  # ---------------------------------------------------------------------
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
 
    # Fork PRs get a read-only token, so SARIF upload would fail.
    # Skip them here; run the scan on the base repo after merge instead.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
 
    permissions:
      contents: read
      actions: read
      security-events: write   # required to upload CodeQL / SARIF results
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      # ---- CodeQL ------------------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
 
      - name: Build for CodeQL
        run: dotnet build ${{ env.SOLUTION }} --no-incremental -c Release
 
      - name: Analyze source code
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
 
      # ---- Trivy (deps, secrets, misconfig) ----------------------------
      # Consider bumping to the latest release and pinning to a commit SHA.
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          skip-dirs: "**/bin,**/obj,**/node_modules"
          exit-code: "1"   # fail the job on CRITICAL/HIGH findings
 
      # Runs even when Trivy fails so findings still reach the Security tab
      - name: Upload Trivy results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
 
