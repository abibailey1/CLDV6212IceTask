
name: Appointment Booking CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
 
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Find project files
        shell: bash
        run: |
          echo "Repository structure:"
          find . -maxdepth 4 -type f \( -name "*.sln" -o -name "*.slnx" -o -name "*.csproj" \)

          find Web-Api Web-App -type f -name "*.csproj" 2>/dev/null > projects.txt

          if [ ! -s projects.txt ]; then
            echo "ERROR: No .csproj files found in Web-Api or Web-App."
            exit 1
          fi

          cat projects.txt

      - name: Restore projects
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < projects.txt

      - name: Build projects
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet build "$project" --configuration Release --no-restore
          done < projects.txt

      - name: Run tests
        shell: bash
        run: |
          while IFS= read -r project; do
            if [[ "$project" == *Test*.csproj || "$project" == *Tests.csproj ]]; then
              dotnet test "$project" --configuration Release --no-build
            fi
          done < projects.txt


  docker-build:
    name: Build Docker Containers
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build


security-scan:
name: Security Scanning
runs-on: ubuntu-latest
needs: build-and-test

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Initialize CodeQL
    uses: github/codeql-action/init@v3
    with:
      languages: csharp

  - name: Build for CodeQL
    uses: github/codeql-action/autobuild@v3

  - name: Analyze source code
    uses: github/codeql-action/analyze@v3

  - name: Scan dependencies and configuration
    uses: aquasecurity/trivy-action@master
    with:
      scan-type: fs
      scan-ref: .
      scanners: vuln,secret,misconfig
      format: table
      exit-code: "0"
      ignore-unfixed: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Analyze source code
        uses: github/codeql-action/analyze@v3

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "0"
          ignore-unfixed: true

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - docker-build
      - security-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /opt/appointment-booking
            git pull origin main
            docker compose up -d --build
