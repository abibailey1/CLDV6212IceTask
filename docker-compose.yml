services:
  api:
    build:
      context: ./Web-api
      dockerfile: AppointmentApp/Dockerfile
    ports:
      - "7083:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped

  webapp:
    build:
      context: ./Web-app
      dockerfile: AppointmentApp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ApiSettings__BaseUrl: http://api:8080/
    depends_on:
      - api
    restart: unless-stopped
