services:
  - type: web
    name: appointment-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./web-api/AppointmentApp/Dockerfile
    dockerContext: ./web-api
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ConnectionStrings__DefaultConnection
        sync: false

  - type: web
    name: appointment-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./web-app/AppointmentApp/Dockerfile
    dockerContext: ./web-app
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: ApiSettings__BaseUrl
        fromService:
          type: web
          name: appointment-api
          envVarKey: RENDER_EXTERNAL_URL
